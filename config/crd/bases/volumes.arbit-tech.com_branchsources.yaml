---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: branchsources.volumes.arbit-tech.com
spec:
  group: volumes.arbit-tech.com
  names:
    kind: BranchSource
    listKind: BranchSourceList
    plural: branchsources
    singular: branchsource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.sizeBytes
      name: Size
      type: integer
    - jsonPath: .status.resolvedProfile.cloneSizeMode
      name: Sizing
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BranchSource is a named, immutable snapshot to branch volumes
          from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BranchSourceSpec defines an immutable snapshot handle to
              branch from.
            properties:
              cloneStorageClassName:
                description: |-
                  cloneStorageClassName is the StorageClass used for PVCs cloned from
                  this source.
                minLength: 1
                type: string
              csiDriver:
                description: |-
                  csiDriver is the CSI driver name the snapshot handle belongs to
                  (e.g. fsx.openzfs.csi.aws.com, zfs.csi.openebs.io).
                minLength: 1
                type: string
              profile:
                description: profile overrides the built-in substrate profile for
                  spec.csiDriver.
                properties:
                  cloneSizeMode:
                    description: cloneSizeMode selects sentinel or actual clone sizing.
                    enum:
                    - sentinel
                    - actual
                    type: string
                  cloneSizeSentinel:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      cloneSizeSentinel is the placeholder capacity requested in sentinel
                      mode (and the fallback in actual mode while the source size is still
                      unknown).
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxWarmingDefault:
                    description: |-
                      maxWarmingDefault caps concurrent warm-clone creations for pools of
                      this source when BranchPool.spec.maxWarming is unset.
                    format: int32
                    minimum: 1
                    type: integer
                  snapshotPinsVolume:
                    description: |-
                      snapshotPinsVolume declares that on this backend a snapshot pins its
                      parent volume, so teardown must remove volume objects before snapshot
                      objects.
                    type: boolean
                type: object
              sizeBytes:
                description: |-
                  sizeBytes declares the snapshot's logical size. Optional: normally the
                  engine discovers it from a VolumeSnapshotContent whose snapshotHandle
                  matches (the snapshot's originating content carries restoreSize).
                  Declare it when that content no longer exists — actual-mode sizing
                  cannot proceed with an unknown size.
                format: int64
                minimum: 1
                type: integer
              snapshotHandle:
                description: |-
                  snapshotHandle is the CSI snapshot handle (driver-specific id) of the
                  immutable source snapshot. Set once; the source is immutable.
                minLength: 1
                type: string
              volumeSnapshotClassName:
                description: |-
                  volumeSnapshotClassName is the VolumeSnapshotClass used when
                  materializing per-branch VolumeSnapshotContent/VolumeSnapshot pairs.
                minLength: 1
                type: string
            required:
            - cloneStorageClassName
            - csiDriver
            - snapshotHandle
            - volumeSnapshotClassName
            type: object
          status:
            description: BranchSourceStatus defines the observed state of BranchSource.
            properties:
              conditions:
                description: |-
                  conditions describe the source's readiness for branching. The Ready
                  condition is stricter than phase: it is True only when clones can be
                  created right now (so a validated source holding for size discovery is
                  phase=Ready but Ready=False/SizeUnknown).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: message carries a human-readable reason for Invalid.
                type: string
              phase:
                description: phase is the validation state of the source.
                enum:
                - Pending
                - Ready
                - Invalid
                type: string
              resolvedProfile:
                description: |-
                  resolvedProfile is the effective substrate profile: the built-in
                  profile for spec.csiDriver with spec.profile overrides applied.
                properties:
                  cloneSizeMode:
                    description: CloneSizeMode selects how clone PVC capacity requests
                      are computed.
                    enum:
                    - sentinel
                    - actual
                    type: string
                  cloneSizeSentinel:
                    type: string
                  maxWarmingDefault:
                    format: int32
                    type: integer
                  snapshotPinsVolume:
                    type: boolean
                required:
                - cloneSizeMode
                - cloneSizeSentinel
                - maxWarmingDefault
                - snapshotPinsVolume
                type: object
              sizeBytes:
                description: sizeBytes is the logical size of the source snapshot,
                  when known.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
