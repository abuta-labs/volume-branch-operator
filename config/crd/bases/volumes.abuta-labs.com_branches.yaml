---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: branches.volumes.abuta-labs.com
spec:
  group: volumes.abuta-labs.com
  names:
    kind: Branch
    listKind: BranchList
    plural: branches
    singular: branch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .spec.pvcName
      name: PVC
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.provisioning
      name: Via
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Branch is one claimed copy-on-write clone of a BranchSource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BranchSpec defines one claimed clone of a BranchSource, terminating at a
              Bound PVC in the Branch's own namespace. The consumer names the PVC
              (preserves ClaimRef pre-bind; the engine never picks names).
            properties:
              pvcName:
                description: |-
                  pvcName is the name of the PVC the engine must produce in this
                  Branch's namespace.
                minLength: 1
                type: string
              resetToken:
                description: |-
                  resetToken, when changed, discards the current clone and re-branches
                  from the same source. Opaque to the engine.
                type: string
              source:
                description: source is the name of the BranchSource to branch from.
                minLength: 1
                type: string
              ttl:
                description: |-
                  ttl, when set, deletes the Branch (and its PVC) this long after it
                  becomes Ready. Consumers with their own reaping policy omit it.
                type: string
            required:
            - pvcName
            - source
            type: object
          status:
            description: BranchStatus defines the observed state of Branch.
            properties:
              claimedVolume:
                description: |-
                  claimedVolume is the PersistentVolume claimed from a pool for this
                  Branch. Persisted immediately after the atomic claim and BEFORE the
                  warm clone's objects are consumed, so the rebind can always be resumed
                  or reclaimed — the warm PVC (the only other marker of the claim) is
                  destroyed mid-rebind.
                type: string
              clonedBytes:
                description: clonedBytes is the clone's logical size, when known.
                format: int64
                type: integer
              conditions:
                description: |-
                  conditions mirror the lifecycle as standard conditions; the Ready
                  condition is True exactly when phase is Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: expiresAt is when spec.ttl will reap this Branch (set
                  once Ready).
                format: date-time
                type: string
              message:
                description: message carries a human-readable reason for Failed.
                type: string
              observedResetToken:
                description: observedResetToken is the last resetToken acted upon.
                type: string
              phase:
                description: |-
                  phase ends at Ready when the named PVC is Bound. What runs on the
                  volume afterwards is the consumer's business.
                enum:
                - Pending
                - Cloning
                - Ready
                - Failed
                type: string
              provisioning:
                description: |-
                  provisioning records the claim path taken (pool fast path vs
                  on-demand clone).
                enum:
                - pool
                - ondemand
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
