# This rule is not used by the project volume-branch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to volumes.abuta-labs.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: volume-branch-operator
    app.kubernetes.io/managed-by: kustomize
  name: branchsource-viewer-role
rules:
- apiGroups:
  - volumes.abuta-labs.com
  resources:
  - branchsources
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - volumes.abuta-labs.com
  resources:
  - branchsources/status
  verbs:
  - get
