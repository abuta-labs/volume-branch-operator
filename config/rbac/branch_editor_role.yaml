# This rule is not used by the project volume-branch-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the volumes.arbit-tech.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: volume-branch-operator
    app.kubernetes.io/managed-by: kustomize
  name: branch-editor-role
rules:
- apiGroups:
  - volumes.arbit-tech.com
  resources:
  - branches
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - volumes.arbit-tech.com
  resources:
  - branches/status
  verbs:
  - get
