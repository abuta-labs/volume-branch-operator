# Minimal BranchSource. See config/samples/zfs-localpv/ for a complete,
# commented walk-through on a proven driver.
apiVersion: volumes.abuta-labs.com/v1alpha1
kind: BranchSource
metadata:
  name: branchsource-sample
spec:
  snapshotHandle: pvc-0000-snap-0000        # CSI snapshot handle to branch from
  csiDriver: zfs.csi.openebs.io
  cloneStorageClassName: branch-clone
  volumeSnapshotClassName: branch-snap
