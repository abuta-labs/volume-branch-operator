# The immutable base every branch is cloned from. Cluster-scoped.
apiVersion: volumes.abuta-labs.com/v1alpha1
kind: BranchSource
metadata:
  name: golden-v1
spec:
  # The handle from seed-snap's VolumeSnapshotContent (see the README).
  snapshotHandle: REPLACE_WITH_SNAPSHOT_HANDLE
  csiDriver: zfs.csi.openebs.io
  cloneStorageClassName: branch-clone
  volumeSnapshotClassName: branch-snap
  # ZFS-LocalPV's built-in profile already selects actual sizing and a high
  # warming cap; override per field only when your setup differs:
  # profile:
  #   maxWarmingDefault: 4
  # If seed-snap's VolumeSnapshotContent no longer exists, declare the size:
  # sizeBytes: 2147483648
