name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload install.yaml
  packages: write   # push the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator image
        run: |
          IMG=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          make docker-build docker-push IMG=$IMG

      - name: Render the install manifest
        run: |
          IMG=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          make build-installer IMG=$IMG
          # kustomize edit dirties config/manager in the workspace only;
          # nothing is committed from a release run.

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/install.yaml \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $(case "${{ github.ref_name }}" in *-*) echo --prerelease;; esac)
